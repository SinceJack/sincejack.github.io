<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>太阳宫锐满分管理系统</title>
<style>
:root{color-scheme:light dark;--bg:#f6f8fc;--panel:#fff;--panel2:#f8fafc;--text:#172033;--muted:#667085;--line:#e6eaf0;--blue:#175cd3;--blue2:#0f4fbf;--green:#079455;--red:#d92d20;--orange:#dc6803;--shadow:0 12px 32px rgba(15,23,42,.06)}@media(prefers-color-scheme:dark){:root{--bg:#08101e;--panel:#111827;--panel2:#0f172a;--text:#eef2f7;--muted:#94a3b8;--line:#233047;--blue:#60a5fa;--blue2:#3b82f6;--green:#34d399;--red:#f87171;--orange:#fbbf24;--shadow:0 14px 34px rgba(0,0,0,.22)}}html[data-theme=light]{--bg:#f6f8fc;--panel:#fff;--panel2:#f8fafc;--text:#172033;--muted:#667085;--line:#e6eaf0;--blue:#175cd3;--blue2:#0f4fbf;--green:#079455;--red:#d92d20;--orange:#dc6803;--shadow:0 12px 32px rgba(15,23,42,.06)}html[data-theme=dark]{--bg:#08101e;--panel:#111827;--panel2:#0f172a;--text:#eef2f7;--muted:#94a3b8;--line:#233047;--blue:#60a5fa;--blue2:#3b82f6;--green:#34d399;--red:#f87171;--orange:#fbbf24;--shadow:0 14px 34px rgba(0,0,0,.22)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:232px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:#0b1b36;color:#d6deeb;padding:20px 14px}.brand{padding:4px 10px 22px;font-weight:850;font-size:17px;color:#fff}.brand small{display:block;color:#7f93b4;font-size:11px;font-weight:600;margin-top:5px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#aebbd0;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer}.nav button:hover,.nav button.active{background:#162b4e;color:#fff}.sidebar-foot{position:absolute;left:14px;right:14px;bottom:18px;display:grid;gap:8px}.sidebar-foot button,.sidebar-foot a{border:1px solid #2a3d5f;background:#102340;color:#c9d5e7;border-radius:9px;padding:9px 10px;text-decoration:none;text-align:center;cursor:pointer;font-size:12px}.main{min-width:0}.topbar{height:64px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:20}.topbar h1{font-size:18px;margin:0}.top-actions{display:flex;align-items:center;gap:8px}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:7px 9px;cursor:pointer}.content{padding:24px 26px 46px;max-width:1500px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px}.page-head h2{font-size:28px;margin:0}.page-head p{margin:5px 0 0;color:var(--muted);font-size:14px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer;text-decoration:none}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red)}.btn.small{padding:5px 8px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.metric span{color:var(--muted);font-size:13px}.metric strong{display:block;font-size:30px;margin-top:6px}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.panel-head h3{margin:0;font-size:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:var(--panel2);color:var(--muted);font-size:11px;letter-spacing:.02em}tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:3px 8px;border-radius:999px;background:#eef4ff;color:var(--blue);font-size:11px}.badge.green{background:#ecfdf3;color:var(--green)}.badge.orange{background:#fff7ed;color:var(--orange)}.empty{padding:28px;text-align:center;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.search{min-width:240px;flex:1;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:9px 11px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:grid;place-items:center;padding:20px;z-index:50}.modal[hidden]{display:none}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.22)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.dialog-head h3{margin:0}.dialog-body{padding:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:9px 10px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:190px;padding:10px}.day-head{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:8px}.event{padding:7px 8px;border-radius:8px;background:color-mix(in srgb,var(--blue) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--blue) 28%,var(--line));font-size:11px;margin-bottom:6px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}.calcell{min-height:110px;background:var(--panel);padding:7px;font-size:11px}.calnum{font-weight:800;color:var(--muted)}.year-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.month-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.month-card strong{font-size:18px}.month-card span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.auth{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 15% 10%,#dbeafe,transparent 28%),#f7f9fc;display:grid;place-items:center;padding:20px}.auth[hidden]{display:none}.auth-card{width:min(460px,100%);background:#fff;color:#172033;border:1px solid #e4e7ec;border-radius:20px;padding:28px;box-shadow:0 24px 70px rgba(15,23,42,.14)}.auth-card h1{margin:0 0 7px;font-size:26px}.auth-card p{color:#667085}.auth-card input{width:100%;padding:11px 12px;border:1px solid #d0d5dd;border-radius:9px;margin:6px 0 10px}.auth-msg{font-size:12px;color:#667085;margin-top:10px}.backup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.backup-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.backup-card h3{margin:0 0 7px}.backup-card p{font-size:13px;color:var(--muted)}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.week{grid-template-columns:1fr}.year-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:780px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidebar-foot{position:static;margin-top:12px;grid-template-columns:1fr 1fr}.topbar{position:static}.content{padding:18px 14px}.cards,.form-grid,.backup-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.year-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="auth" class="auth"><div class="auth-card"><h1>太阳宫锐满分管理系统</h1><p>仅本人使用。使用你的 GitHub 身份验证后进入，数据保存在当前浏览器本地。</p><input id="tokenInput" type="password" autocomplete="off" placeholder="GitHub Token"><button id="authBtn" class="btn primary" style="width:100%">验证 @SinceJack 并进入</button><div id="authMsg" class="auth-msg"></div></div></div>
<div class="app" id="app" hidden>
<aside class="sidebar"><div class="brand">太阳宫锐满分管理系统<small>RUIMANFEN · UNIFIED PAGES EDITION</small></div><nav class="nav" id="nav"><button data-page="dashboard" class="active">工作台</button><button data-page="teachers">教师档案</button><button data-page="students">学生管理</button><button data-page="consultations">咨询 / 公海</button><button data-page="schedule">排课中心</button><button data-page="managers">学管管理</button><button data-page="backup">数据备份</button></nav><div class="sidebar-foot"><a href="/">返回个人主页</a><button id="logoutBtn">退出身份</button></div></aside>
<main class="main"><header class="topbar"><h1 id="pageTitle">工作台</h1><div class="top-actions"><span style="font-size:12px;color:var(--muted)">@SinceJack</span><button class="iconbtn" id="themeBtn">🖥️</button></div></header><div class="content" id="content"></div></main>
</div>
<div class="modal" id="modal" hidden><div class="dialog"><div class="dialog-head"><h3 id="modalTitle">新增</h3><button class="iconbtn" id="modalClose">✕</button></div><div class="dialog-body" id="modalBody"></div></div></div>
<script>
(()=>{
const OWNER='SinceJack',KEY='rmf_unified_pages_v1';
const qs=s=>document.querySelector(s), qsa=s=>[...document.querySelectorAll(s)];
const empty=()=>({teachers:[],students:[],consultations:[],schedules:[],managers:[],meta:{version:1,updatedAt:Date.now()}});
let db=load(), page='dashboard', scheduleView='week';
function load(){try{return {...empty(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return empty()}}
function save(){db.meta={version:1,updatedAt:Date.now()};localStorage.setItem(KEY,JSON.stringify(db));render()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function fmtDate(d){return new Date(d).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})}
function today(){const d=new Date();return d.toISOString().slice(0,10)}
const names={dashboard:'工作台',teachers:'教师档案',students:'学生管理',consultations:'咨询 / 公海',schedule:'排课中心',managers:'学管管理',backup:'数据备份'};
function setPage(p){page=p;qsa('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));qs('#pageTitle').textContent=names[p];render()}
qsa('#nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function teacherName(x){return db.teachers.find(t=>t.id===x)?.name||'—'}function studentName(x){return db.students.find(t=>t.id===x)?.name||'—'}function managerName(x){return db.managers.find(t=>t.id===x)?.name||'—'}
function metric(label,n){return `<div class="metric"><span>${label}</span><strong>${n}</strong></div>`}
function render(){const c=qs('#content');if(page==='dashboard')c.innerHTML=dashboard();if(page==='teachers')c.innerHTML=teachers();if(page==='students')c.innerHTML=students();if(page==='consultations')c.innerHTML=consultations();if(page==='schedule')c.innerHTML=schedule();if(page==='managers')c.innerHTML=managers();if(page==='backup')c.innerHTML=backup();bindPage()}
function dashboard(){const ts=today(),todaySchedules=db.schedules.filter(x=>x.date===ts);return `<div class="page-head"><div><h2>工作台</h2><p>教师、学生、咨询与排课统一管理。</p></div></div><div class="cards">${metric('教师档案',db.teachers.length)}${metric('在读学生',db.students.filter(x=>x.status!=='结课').length)}${metric('今日排课',todaySchedules.length)}${metric('待跟进咨询',db.consultations.filter(x=>!['已报名','已关闭'].includes(x.status)).length)}</div><div class="grid2"><section class="panel"><div class="panel-head"><h3>今日排课</h3><button class="btn small" data-go="schedule">进入排课</button></div>${todaySchedules.length?`<div class="table-wrap"><table><tr><th>时间</th><th>学生</th><th>教师</th><th>学科</th><th>教室</th></tr>${todaySchedules.map(x=>`<tr><td>${esc(x.start)}-${esc(x.end)}</td><td>${esc(studentName(x.studentId))}</td><td>${esc(teacherName(x.teacherId))}</td><td>${esc(x.subject)}</td><td>${esc(x.room)}</td></tr>`).join('')}</table></div>`:'<div class="empty">今天暂无排课</div>'}</section><section class="panel"><div class="panel-head"><h3>待处理咨询</h3></div>${db.consultations.length?`<div class="table-wrap"><table><tr><th>学生</th><th>方向</th><th>状态</th></tr>${db.consultations.slice(-6).reverse().map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.direction)}</td><td><span class="badge orange">${esc(x.status)}</span></td></tr>`).join('')}</table></div>`:'<div class="empty">暂无咨询记录</div>'}</section></div>`}
function teachers(){return `<div class="page-head"><div><h2>教师档案</h2><p>统一维护教师学科、学段、课时费、评级和可授课信息。</p></div><button class="btn primary" data-add="teacher">+ 新增教师</button></div><div class="toolbar"><input class="search" id="teacherSearch" placeholder="搜索教师 / 学科 / 学段"></div><section class="panel"><div class="table-wrap"><table id="teacherTable"><tr><th>教师</th><th>学科</th><th>学段</th><th>评级</th><th>课时费</th><th>状态</th><th>操作</th></tr>${db.teachers.map(x=>`<tr data-text="${esc((x.name+' '+x.subject+' '+x.stage).toLowerCase())}"><td><strong>${esc(x.name)}</strong></td><td>${esc(x.subject)}</td><td>${esc(x.stage)}</td><td>${'★'.repeat(Number(x.rating||0))}</td><td>${esc(x.fee)}</td><td><span class="badge green">${esc(x.status||'在库')}</span></td><td><button class="btn small" data-edit-teacher="${x.id}">编辑</button> <button class="btn small danger" data-del="teachers:${x.id}">删除</button></td></tr>`).join('')}</table></div>${!db.teachers.length?'<div class="empty">还没有教师档案</div>':''}</section>`}
function students(){return `<div class="page-head"><div><h2>学生管理</h2><p>正式学生、学管、匹配教师与学习状态统一维护。</p></div><button class="btn primary" data-add="student">+ 新增学生</button></div><section class="panel"><div class="table-wrap"><table><tr><th>学生</th><th>学段</th><th>学校</th><th>学科</th><th>教师</th><th>学管</th><th>状态</th><th>操作</th></tr>${db.students.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.stage)}</td><td>${esc(x.school)}</td><td>${esc(x.subject)}</td><td>${esc(teacherName(x.teacherId))}</td><td>${esc(managerName(x.managerId))}</td><td><span class="badge ${x.status==='在读'?'green':''}">${esc(x.status)}</span></td><td><button class="btn small" data-edit-student="${x.id}">编辑</button> <button class="btn small danger" data-del="students:${x.id}">删除</button></td></tr>`).join('')}</table></div>${!db.students.length?'<div class="empty">还没有正式学生</div>':''}</section>`}
function consultations(){return `<div class="page-head"><div><h2>咨询 / 公海</h2><p>咨询登记 → 试听 → 师资匹配 → 转正式学生。</p></div><button class="btn primary" data-add="consultation">+ 新增咨询</button></div><section class="panel"><div class="table-wrap"><table><tr><th>学生</th><th>学段</th><th>学科</th><th>方向</th><th>试听时间</th><th>匹配教师</th><th>状态</th><th>操作</th></tr>${db.consultations.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.stage)}</td><td>${esc(x.subject)}</td><td>${esc(x.direction)}</td><td>${esc(x.trialTime)}</td><td>${esc(teacherName(x.teacherId))}</td><td><span class="badge orange">${esc(x.status)}</span></td><td><button class="btn small" data-edit-consultation="${x.id}">编辑</button> ${x.status!=='已报名'?`<button class="btn small" data-convert="${x.id}">转正式</button>`:''} <button class="btn small danger" data-del="consultations:${x.id}">删除</button></td></tr>`).join('')}</table></div>${!db.consultations.length?'<div class="empty">暂无咨询记录</div>':''}</section>`}
function managers(){return `<div class="page-head"><div><h2>学管管理</h2><p>维护班主任 / 学管信息，供学生和咨询关联。</p></div><button class="btn primary" data-add="manager">+ 新增学管</button></div><section class="panel"><div class="table-wrap"><table><tr><th>姓名</th><th>电话</th><th>负责学生数</th><th>备注</th><th>操作</th></tr>${db.managers.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.phone)}</td><td>${db.students.filter(s=>s.managerId===x.id).length}</td><td>${esc(x.notes)}</td><td><button class="btn small" data-edit-manager="${x.id}">编辑</button> <button class="btn small danger" data-del="managers:${x.id}">删除</button></td></tr>`).join('')}</table></div>${!db.managers.length?'<div class="empty">暂无学管</div>':''}</section>`}
function startOfWeek(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(0,0,0,0);return d}
function schedule(){let body='';if(scheduleView==='week'){const s=startOfWeek(),days=[0,1,2,3,4,5,6].map(i=>{const d=new Date(s);d.setDate(s.getDate()+i);const key=d.toISOString().slice(0,10),items=db.schedules.filter(x=>x.date===key).sort((a,b)=>a.start.localeCompare(b.start));return `<div class="day"><div class="day-head">${['周一','周二','周三','周四','周五','周六','周日'][i]} · ${fmtDate(d)}</div>${items.map(x=>`<div class="event"><b>${esc(x.start)} ${esc(studentName(x.studentId))}</b><br>${esc(teacherName(x.teacherId))} · ${esc(x.subject)}<br>${esc(x.room)}</div>`).join('')||'<span style="color:var(--muted);font-size:11px">无排课</span>'}</div>`}).join('');body=`<div class="week">${days}</div>`}else if(scheduleView==='month'){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),offset=(first.getDay()+6)%7,cells=[];for(let i=0;i<offset;i++)cells.push('<div class="calcell"></div>');for(let d=1;d<=last.getDate();d++){const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,items=db.schedules.filter(x=>x.date===key);cells.push(`<div class="calcell"><div class="calnum">${d}</div>${items.slice(0,4).map(x=>`<div class="event">${esc(x.start)} ${esc(studentName(x.studentId))}</div>`).join('')}</div>`)}body=`<div class="calendar">${cells.join('')}</div>`}else{const y=new Date().getFullYear();body=`<div class="year-grid">${Array.from({length:12},(_,i)=>{const prefix=`${y}-${String(i+1).padStart(2,'0')}`,n=db.schedules.filter(x=>x.date.startsWith(prefix)).length;return `<div class="month-card"><strong>${i+1} 月</strong><span>${n} 节课程</span></div>`}).join('')}</div>`}return `<div class="page-head"><div><h2>排课中心</h2><p>周 / 月 / 年视图；新增排课时自动检查教师和学生时间冲突。</p></div><button class="btn primary" data-add="schedule">+ 新增排课</button></div><div class="toolbar"><button class="btn small ${scheduleView==='week'?'primary':''}" data-view="week">周</button><button class="btn small ${scheduleView==='month'?'primary':''}" data-view="month">月</button><button class="btn small ${scheduleView==='year'?'primary':''}" data-view="year">年</button></div>${body}`}
function backup(){const size=new Blob([JSON.stringify(db)]).size;return `<div class="page-head"><div><h2>数据备份</h2><p>Pages 版数据保存在当前浏览器；建议定期导出 JSON。</p></div></div><div class="backup-grid"><div class="backup-card"><h3>导出备份</h3><p>当前约 ${(size/1024).toFixed(1)} KB。下载完整 JSON，可在其他电脑恢复。</p><button class="btn primary" id="exportBtn">导出 JSON</button></div><div class="backup-card"><h3>导入恢复</h3><p>选择此前导出的 JSON 文件，会覆盖当前数据。</p><input id="importInput" type="file" accept="application/json" hidden><button class="btn" id="importBtn">选择备份文件</button></div><div class="backup-card"><h3>清空数据</h3><p>仅清空本浏览器里的系统数据，不影响 GitHub Pages 页面本身。</p><button class="btn danger" id="resetBtn">清空全部数据</button></div></div>`}
function opts(arr,selected,label){return `<option value="">未指定</option>${arr.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x[label||'name'])}</option>`).join('')}`}
function openModal(title,html,onSave){qs('#modalTitle').textContent=title;qs('#modalBody').innerHTML=`<form id="modalForm">${html}<div class="dialog-actions"><button type="button" class="btn" id="cancelModal">取消</button><button class="btn primary">保存</button></div></form>`;qs('#modal').hidden=false;qs('#cancelModal').onclick=closeModal;qs('#modalForm').onsubmit=e=>{e.preventDefault();onSave(new FormData(e.target));closeModal();save()}}
function closeModal(){qs('#modal').hidden=true}
qs('#modalClose').onclick=closeModal;
function teacherForm(x={}){openModal(x.id?'编辑教师':'新增教师',`<div class="form-grid"><div class="field"><label>姓名</label><input name="name" value="${esc(x.name)}" required></div><div class="field"><label>学科</label><input name="subject" value="${esc(x.subject)}"></div><div class="field"><label>学段</label><input name="stage" value="${esc(x.stage)}" placeholder="初中 / 高中"></div><div class="field"><label>评级（1-5）</label><input name="rating" type="number" min="1" max="5" value="${esc(x.rating||5)}"></div><div class="field"><label>课时费</label><input name="fee" value="${esc(x.fee)}"></div><div class="field"><label>状态</label><select name="status"><option>在库</option><option ${x.status==='暂停'?'selected':''}>暂停</option></select></div><div class="field full"><label>可授课时间</label><input name="availability" value="${esc(x.availability)}" placeholder="例如 周二晚、周六全天"></div><div class="field full"><label>标签 / 优势</label><input name="tags" value="${esc(x.tags)}"></div><div class="field full"><label>备注</label><textarea name="notes">${esc(x.notes)}</textarea></div></div>`,fd=>{const o=Object.fromEntries(fd);o.rating=Number(o.rating||0);if(x.id)Object.assign(x,o);else db.teachers.push({id:id(),...o})})}
function studentForm(x={}){openModal(x.id?'编辑学生':'新增学生',`<div class="form-grid"><div class="field"><label>姓名</label><input name="name" value="${esc(x.name)}" required></div><div class="field"><label>学段</label><input name="stage" value="${esc(x.stage)}"></div><div class="field"><label>学校</label><input name="school" value="${esc(x.school)}"></div><div class="field"><label>主科 / 需求</label><input name="subject" value="${esc(x.subject)}"></div><div class="field"><label>匹配教师</label><select name="teacherId">${opts(db.teachers,x.teacherId)}</select></div><div class="field"><label>学管</label><select name="managerId">${opts(db.managers,x.managerId)}</select></div><div class="field"><label>状态</label><select name="status"><option ${x.status==='在读'?'selected':''}>在读</option><option ${x.status==='暂停'?'selected':''}>暂停</option><option ${x.status==='结课'?'selected':''}>结课</option></select></div><div class="field full"><label>备注</label><textarea name="notes">${esc(x.notes)}</textarea></div></div>`,fd=>{const o=Object.fromEntries(fd);if(x.id)Object.assign(x,o);else db.students.push({id:id(),...o})})}
function consultationForm(x={}){openModal(x.id?'编辑咨询':'新增咨询',`<div class="form-grid"><div class="field"><label>学生</label><input name="name" value="${esc(x.name)}" required></div><div class="field"><label>学段</label><input name="stage" value="${esc(x.stage)}"></div><div class="field"><label>学科</label><input name="subject" value="${esc(x.subject)}"></div><div class="field"><label>方向</label><select name="direction"><option ${x.direction==='1v1'?'selected':''}>1v1</option><option ${x.direction==='速记'?'selected':''}>速记</option></select></div><div class="field"><label>试听时间</label><input type="datetime-local" name="trialTime" value="${esc(x.trialTime)}"></div><div class="field"><label>匹配教师</label><select name="teacherId">${opts(db.teachers,x.teacherId)}</select></div><div class="field"><label>学管</label><select name="managerId">${opts(db.managers,x.managerId)}</select></div><div class="field"><label>状态</label><select name="status">${['未试听','已安排试听','已试听','已报名','已关闭'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field full"><label>备注</label><textarea name="notes">${esc(x.notes)}</textarea></div></div>`,fd=>{const o=Object.fromEntries(fd);if(x.id)Object.assign(x,o);else db.consultations.push({id:id(),...o,status:o.status||'未试听'})})}
function managerForm(x={}){openModal(x.id?'编辑学管':'新增学管',`<div class="form-grid"><div class="field"><label>姓名</label><input name="name" value="${esc(x.name)}" required></div><div class="field"><label>电话</label><input name="phone" value="${esc(x.phone)}"></div><div class="field full"><label>备注</label><textarea name="notes">${esc(x.notes)}</textarea></div></div>`,fd=>{const o=Object.fromEntries(fd);if(x.id)Object.assign(x,o);else db.managers.push({id:id(),...o})})}
function scheduleForm(){openModal('新增排课',`<div class="form-grid"><div class="field"><label>日期</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>学科</label><input name="subject"></div><div class="field"><label>学生</label><select name="studentId" required>${opts(db.students,'')}</select></div><div class="field"><label>教师</label><select name="teacherId" required>${opts(db.teachers,'')}</select></div><div class="field"><label>开始</label><input type="time" name="start" value="18:00" required></div><div class="field"><label>结束</label><input type="time" name="end" value="20:00" required></div><div class="field"><label>教室 / 桌位</label><input name="room"></div><div class="field full"><label>备注</label><textarea name="notes"></textarea></div></div>`,fd=>{const o=Object.fromEntries(fd);const conflict=db.schedules.find(s=>s.date===o.date&&!(o.end<=s.start||o.start>=s.end)&&(s.teacherId===o.teacherId||s.studentId===o.studentId));if(conflict){alert('检测到教师或学生时间冲突，本次排课未保存。');return}db.schedules.push({id:id(),...o})})}
function bindPage(){qsa('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));qsa('[data-add]').forEach(b=>b.onclick=()=>({teacher:teacherForm,student:studentForm,consultation:consultationForm,manager:managerForm,schedule:scheduleForm}[b.dataset.add])());qsa('[data-edit-teacher]').forEach(b=>b.onclick=()=>teacherForm(db.teachers.find(x=>x.id===b.dataset.editTeacher)));qsa('[data-edit-student]').forEach(b=>b.onclick=()=>studentForm(db.students.find(x=>x.id===b.dataset.editStudent)));qsa('[data-edit-consultation]').forEach(b=>b.onclick=()=>consultationForm(db.consultations.find(x=>x.id===b.dataset.editConsultation)));qsa('[data-edit-manager]').forEach(b=>b.onclick=()=>managerForm(db.managers.find(x=>x.id===b.dataset.editManager)));qsa('[data-del]').forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.del.split(':');if(confirm('确定删除这条记录吗？')){db[k]=db[k].filter(x=>x.id!==i);save()}});qsa('[data-convert]').forEach(b=>b.onclick=()=>{const x=db.consultations.find(c=>c.id===b.dataset.convert);if(!x)return;db.students.push({id:id(),name:x.name,stage:x.stage,school:'',subject:x.subject,teacherId:x.teacherId,managerId:x.managerId,status:'在读',notes:x.notes||''});x.status='已报名';save();setPage('students')});qsa('[data-view]').forEach(b=>b.onclick=()=>{scheduleView=b.dataset.view;render()});const s=qs('#teacherSearch');if(s)s.oninput=()=>qsa('#teacherTable tr[data-text]').forEach(r=>r.style.display=r.dataset.text.includes(s.value.toLowerCase())?'':'none');if(qs('#exportBtn'))qs('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='太阳宫锐满分管理系统备份-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if(qs('#importBtn')){qs('#importBtn').onclick=()=>qs('#importInput').click();qs('#importInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(confirm('导入会覆盖当前数据，确定继续？')){db={...empty(),...data};save()}}catch(e){alert('备份文件格式错误')}};r.readAsText(f)}}if(qs('#resetBtn'))qs('#resetBtn').onclick=()=>{if(confirm('确定清空当前浏览器全部系统数据？')&&confirm('再次确认：此操作不可撤销。')){db=empty();localStorage.removeItem(KEY);render()}}}
const root=document.documentElement;const savedTheme=localStorage.getItem('rmf_theme');if(savedTheme==='light'||savedTheme==='dark')root.dataset.theme=savedTheme;function themeLabel(){const m=root.dataset.theme||'system';qs('#themeBtn').textContent=m==='light'?'☀️':m==='dark'?'🌙':'🖥️'}qs('#themeBtn').onclick=()=>{const m=root.dataset.theme||'system';if(m==='system'){root.dataset.theme='light';localStorage.setItem('rmf_theme','light')}else if(m==='light'){root.dataset.theme='dark';localStorage.setItem('rmf_theme','dark')}else{root.removeAttribute('data-theme');localStorage.removeItem('rmf_theme')}themeLabel()};themeLabel();
async function verify(token){const r=await fetch('https://api.github.com/user',{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}});const u=await r.json().catch(()=>({}));if(!r.ok)throw new Error(u.message||'验证失败');if(u.login!==OWNER)throw new Error('当前账号 @'+u.login+' 无访问权限');sessionStorage.setItem('rmf_token',token);qs('#auth').hidden=true;qs('#app').hidden=false;render()}
qs('#authBtn').onclick=async()=>{qs('#authMsg').textContent='正在验证…';try{await verify(qs('#tokenInput').value.trim());qs('#authMsg').textContent=''}catch(e){qs('#authMsg').textContent=e.message}};qs('#logoutBtn').onclick=()=>{sessionStorage.removeItem('rmf_token');location.reload()};const token=sessionStorage.getItem('rmf_token')||sessionStorage.getItem('blog_github_token')||'';if(token)verify(token).catch(()=>{});
})();
</script>
</body></html>
